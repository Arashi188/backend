services:
  - type: web
    name: shophub-backend
    runtime: python
    repo: https://github.com/your-username/your-repo
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: shophub-db
          property: connectionString